name: insta_clone
description: "Instagram Clone - Flutter Web App with Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.8.4

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Image
  image_picker: ^1.1.2

  # Utils
  timeago: ^3.7.0
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
